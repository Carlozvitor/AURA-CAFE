<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="smooth-wrapper">
    <div id="smooth-content">

      <section class="scroll-video-section" id="scroll-video-section">
        <div class="scroll-video-sticky">
          <canvas class="scroll-frame" id="scroll-frame"></canvas>
          <div class="scroll-text" id="scroll-text">
            <span class="scroll-text__kicker" id="scroll-text-kicker"></span>
            <p class="scroll-text__line" id="scroll-text-line"></p>
          </div>
        </div>
      </section>

      <section class="about-section" id="about-section">
        <div class="about-graphic" aria-hidden="true">
          <div class="about-graphic__halo"></div>
          <div class="about-graphic__ring"></div>
        </div>
        <div class="about-content">
          <p class="about-kicker" id="about-kicker">02 — A AURA</p>
          <h2 class="about-title" id="about-title">Mais do que café.</h2>
          <p class="about-subtitle" id="about-subtitle">É um jeito de estar presente.</p>
          <p class="about-mark" id="about-mark">AURA CAFÉ</p>
        </div>
      </section>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollSmoother.min.js"></script>
  <script src="js/scroll-frames.js"></script>
  <script src="js/about-section.js"></script>
</body>
</html>
